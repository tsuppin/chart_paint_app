<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>paint</title>
    <meta name="description" content="画像のアップロード、ペイント、保存ができるモダンで多機能なキャンバスアプリ。">
    <link rel="stylesheet" href="paint_styles.css?v=14">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar glass">
            <!-- 1段目: 描画ツール + カラーパレット -->
            <div class="toolbar-row">
                <section class="tool-section">
                    <div class="tool-grid">
                        <button id="btn-pencil" class="tool-btn active" title="フリーハンド">
                            <i class="fas fa-pencil-alt"></i>
                        </button>
                        <button id="btn-line" class="tool-btn" title="直線 (弱めマグネット)">
                            <i class="fas fa-minus"></i>
                        </button>
                        <button id="btn-rect" class="tool-btn" title="四角 / 線 (斜め対応・弱めマグネット)">
                            <i class="far fa-square"></i>
                        </button>
                        <button id="btn-circle" class="tool-btn" title="円">
                            <i class="far fa-circle"></i>
                        </button>
                        <button id="btn-fill" class="tool-btn" title="塗りつぶし (四角・円をクリック)">
                            <i class="fas fa-fill-drip"></i>
                        </button>
                        <button id="btn-text" class="tool-btn" title="テキスト">
                            <i class="fas fa-font"></i>
                        </button>
                        <button id="btn-move" class="tool-btn" title="移動 (削除: Delete)">
                            <i class="fas fa-arrows-alt"></i>
                        </button>
                    </div>
                </section>

                <section class="color-section">
                    <div class="color-palette">
                        <button class="color-btn" data-color="#ff4d4d" title="赤" style="background-color: #ff4d4d;"></button>
                        <button class="color-btn" data-color="#2ecc71" title="緑" style="background-color: #2ecc71;"></button>
                        <button class="color-btn" data-color="#3498db" title="青" style="background-color: #3498db;"></button>
                        <button class="color-btn" data-color="#9b59b6" title="紫" style="background-color: #9b59b6;"></button>
                        <button class="color-btn" data-color="#e67e22" title="オレンジ" style="background-color: #e67e22;"></button>
                        <button class="color-btn" data-color="#f1c40f" title="黄色" style="background-color: #f1c40f;"></button>
                        <button class="color-btn active" data-color="#ffffff" title="白" style="background-color: #ffffff;"></button>
                        <button class="color-btn" data-color="#1e1e1e" title="黒" style="background-color: #1e1e1e;"></button>
                    </div>
                </section>
            </div>

            <!-- 2段目: アクションボタン -->
            <div class="toolbar-row action-row">

                <section class="action-section">
                    <input type="file" id="image-upload" accept="image/*" multiple hidden>
                    <input type="file" id="folder-upload" accept="image/*" webkitdirectory multiple hidden>
                    <span id="upload-filename" class="upload-filename" title=""></span>
                    <button id="btn-folder" class="action-btn upload-btn" title="フォルダを選択"><i class="fas fa-folder-open"></i></button>
                    <button id="btn-upload" class="action-btn upload-btn" title="画像をアップロード">
                        <i class="fas fa-image"></i> 画像
                    </button>
                    <div id="image-pager" class="image-pager hidden"><button id="btn-page-prev" class="action-btn" title="前の画像"><i class="fas fa-chevron-left"></i></button><span id="pager-label">1/1</span><button id="btn-page-next" class="action-btn" title="次の画像"><i class="fas fa-chevron-right"></i></button></div>
                    <button id="btn-opacity" class="action-btn opacity-btn" title="画像の透過度を変更 (タップ: 切替 / 長押し: 詳細)" disabled>
                        <i class="fas fa-circle-half-stroke"></i> <span class="btn-text-label">透過</span> <span id="opacity-val">100%</span>
                    </button>
                    <button id="btn-save" class="action-btn save-btn" title="保存する">
                        <i class="fas fa-download"></i> 保存
                    </button>
                    <button id="btn-grid" class="action-btn grid-btn" title="グリッド表示の切替 (G)">
                        <i class="fas fa-border-all"></i>
                    </button>
                    <button id="btn-undo" class="action-btn undo-btn" title="元に戻す (Ctrl+Z)" disabled>
                        <i class="fas fa-undo"></i>
                    </button>
                    <button id="btn-clear" class="action-btn clear-btn" title="クリア">
                        <i class="fas fa-trash"></i>
                    </button>
                </section>
            </div>

            <!-- 3段目: 画像サイズ(拡大縮小) + ブラシサイズ -->
            <div class="toolbar-row">
                <section class="brush-section zoom-section">
                    <button id="btn-zoom-dec" class="size-adj-btn" title="画像を小さく"><i class="fas fa-minus"></i></button>
                    <span id="zoom-val" class="size-val" title="画像の表示倍率">100%</span>
                    <button id="btn-zoom-inc" class="size-adj-btn" title="画像を大きく"><i class="fas fa-plus"></i></button>
                </section>

                <section class="brush-section">
                    <button id="btn-brush-dec" class="size-adj-btn" title="ブラシを小さく"><i class="fas fa-minus"></i></button>
                    <span id="brush-size-val" class="size-val" title="線の太さ">3px</span>
                    <input type="range" id="brush-size" min="1" max="50" value="3" title="ブラシの太さ" style="display:none;">
                    <button id="btn-brush-inc" class="size-adj-btn" title="ブラシを大きく"><i class="fas fa-plus"></i></button>
                </section>
            </div>

            <!-- 透過度微調整ポップアップ（長押しまたは詳細時） -->
            <div id="opacity-popup" class="opacity-popup hidden">
                <div class="opacity-popup-header">
                    <span><i class="fas fa-circle-half-stroke"></i> 画像の透過度 (10%刻み)</span>
                    <button id="btn-close-opacity" class="popup-close-btn" title="閉じる">&times;</button>
                </div>
                <div class="opacity-slider-row">
                    <input type="range" id="opacity-range" min="0" max="100" value="100" step="10">
                    <span id="opacity-range-val">100%</span>
                </div>
                <div class="opacity-presets">
                    <button type="button" class="preset-btn" data-val="1.0">100%</button>
                    <button type="button" class="preset-btn" data-val="0.8">80%</button>
                    <button type="button" class="preset-btn" data-val="0.6">60%</button>
                    <button type="button" class="preset-btn" data-val="0.4">40%</button>
                    <button type="button" class="preset-btn" data-val="0.2">20%</button>
                    <button type="button" class="preset-btn" data-val="0">0%</button>
                </div>
            </div>
        </aside>

        <main class="canvas-area">
            <div class="tool-status" id="tool-status">Mode: Pencil</div>
            <div id="canvas-container" class="canvas-container">
                <canvas id="main-canvas"></canvas><canvas id="grid-canvas" class="grid-canvas hidden"></canvas>
                <div id="drop-zone" class="drop-zone-overlay">
                    <p><i class="fas fa-cloud-upload-alt"></i> 画像をドラッグ＆ドロップまたはクリックでアップロード</p>
                </div>
            </div>
        </main>
    </div>

    <!-- UI Overlay for cursor or hints -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script src="script.js?v=32"></script>
</body>
</html>
